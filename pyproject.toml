[project]
name = "open-router-data-scraper"
version = "0.1.0"
description = "Periodical scraper for OpenRouter model activity data (token usage, request counts)"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27.0",
]

[project.optional-dependencies]
viz = [
  "matplotlib>=3.8.0",
]
dev = [
  "pytest>=8.3.0",
]

[project.scripts]
ords = "open_router_data_scraper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_router_data_scraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]