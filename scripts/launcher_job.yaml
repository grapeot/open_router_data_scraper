# launcher.yaml periodic job entry for ORDS weekly scrape.
# Add this under periodic_jobs in your launcher.yaml.
# Schedule: every Friday 09:00 local time.
#
# Environment variables needed:
#   OPENCODE_SKILL_DIR        — absolute path to the OpenCode skill project (required)
#   RESEND_SKILL_DIR          — absolute path to the email skill project (required)
#   ORDS_NOTIFY_EMAIL         — recipient address for digest / failure notifications (required)
#   ORDS_SEARCH_SKILL_PATH    — path to the web-search skill used for enrichment (required)
#   ORDS_WRITING_SKILL_DIR    — directory holding the drafting CLI + writing workflow (required)
#   ORDS_AGY_BIN              — drafting CLI binary (optional, default: agy)
#
# Example:
#
# periodic_jobs:
#   ords_weekly_scrape:
#     label: ords_weekly_scrape
#     command:
#       - /path/to/open_router_data_scraper/scripts/run_periodic.sh
#     cwd: /path/to/open_router_data_scraper
#     env:
#       OPENCODE_SKILL_DIR: /path/to/opencode_skill
#       RESEND_SKILL_DIR: /path/to/resend_email_skill
#       ORDS_NOTIFY_EMAIL: your-email@example.com
#       ORDS_SEARCH_SKILL_PATH: /path/to/search_skill.md
#       ORDS_WRITING_SKILL_DIR: /path/to/writing_skills
#     schedule:
#       type: weekly
#       days_of_week: [fri]
#       time: "09:00"
#       timezone: America/Los_Angeles
#     timeout: 2400

label: ords_weekly_scrape
schedule: weekly
days_of_week: [fri]
time: "09:00"
timezone: America/Los_Angeles
timeout: 2400